name: tests

on:
  pull_request:  # every PR, including ones stacked on another branch
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q  # DEMO_MODE and a fake adapter: no network, no keys
