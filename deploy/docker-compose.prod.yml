# Production: one small server (AWS Lightsail, 2 GB+). See deploy/README.md.
#   docker compose -f deploy/docker-compose.prod.yml up -d
# Settings come from deploy/.env.production (copy .env.production.example).
name: binny

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20
    networks: [data]                   # only api, worker and backup can reach it

  api:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      SCRAPER_URL: http://scraper:8100   # council scrapers run in the scraper container
    networks: [default, data]
    # Migrations run on every start (safe to repeat), then the web server behind Caddy.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db: { condition: service_healthy }
      scraper: { condition: service_started }

  worker:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      SCRAPER_URL: http://scraper:8100
    networks: [default, data]
    command: python -m app.workers.main
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }   # api applies the migrations first
      scraper: { condition: service_started }

  # Council scrapers: third-party code reading third-party websites, so they run here with
  # no database access (not on the `data` network), no env file (no Meta, address or database
  # secrets), a read-only filesystem, no Linux capabilities and no published port.
  scraper:
    build: ..
    restart: unless-stopped
    environment:
      SELENIUM_URL: http://selenium:4444
      BROWSER_SESSIONS: 3                # keep equal to SE_NODE_MAX_SESSIONS below (2 CPUs: 3 is the most that helps)
      SCRAPE_TIMEOUT_SECONDS: 90
      HOME: /tmp
    # Only the proxy address (COUNCIL_PROXY_URL), for councils that block cloud servers. Optional.
    env_file:
      - path: .env.scraper
        required: false
    command: uvicorn app.scraper.service:app --host 0.0.0.0 --port 8100
    working_dir: /tmp                    # scrapers that write files write to the tmpfs
    user: "65534:65534"                  # nobody
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256

  # Some councils' sites only work in a real browser.
  selenium:
    image: selenium/standalone-chromium:4.48.0-20260905  # pinned; bump on purpose
    restart: unless-stopped
    shm_size: 1g
    mem_limit: 2g                          # ~350MB a session: room for 3, never the whole server
    environment:
      SE_NODE_MAX_SESSIONS: 3              # keep equal to BROWSER_SESSIONS in the scraper service above
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

  # HTTPS for DOMAIN, certificates from Let's Encrypt, renewed automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production          # DOMAIN
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  # Daily database backup into the `backups` volume; keeps the last 14 days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      PGHOST: db
    networks: [data]
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        until pg_isready -q; do sleep 5; done
        while true; do
          f=/backups/binny-$$(date +%Y-%m-%d).sql.gz
          pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
          find /backups -name 'binny-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }

  # Copies the daily backups to an S3 bucket, so they survive losing the server. Upload-only
  # key: it can add files but not read or delete them (deploy/README.md, "Off-server backups").
  # Idle until BACKUP_S3_BUCKET is set.
  offsite:
    image: amazon/aws-cli:2.38.0
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -n "$$BACKUP_S3_BUCKET" ]; then
            if AWS_ACCESS_KEY_ID="$$BACKUP_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$BACKUP_AWS_SECRET_ACCESS_KEY" \
               aws s3 sync /backups "s3://$$BACKUP_S3_BUCKET/db/" --region "$${BACKUP_S3_REGION:-eu-west-2}" \
                 --exclude "*.tmp" --sse AES256 --only-show-errors; then
              echo "offsite: backups copied to $$BACKUP_S3_BUCKET"
              [ -n "$$BACKUP_HEARTBEAT_URL" ] && curl -fsS -m 10 -o /dev/null "$$BACKUP_HEARTBEAT_URL" || true
            else
              echo "offsite: copy failed" >&2
              [ -n "$$BACKUP_HEARTBEAT_URL" ] && curl -fsS -m 10 -o /dev/null "$$BACKUP_HEARTBEAT_URL/fail" || true
            fi
          fi
          sleep 21600
        done
    depends_on: [backup]

networks:
  default: {}
  # The database's network: no internet, and only api, worker and backup are on it.
  data:
    internal: true

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
