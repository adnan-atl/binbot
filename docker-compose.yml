services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: binbot
      POSTGRES_PASSWORD: binbot
      POSTGRES_DB: binbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binbot"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://binbot:binbot@db:5432/binbot
      SCRAPER_URL: http://scraper:8100
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes:
      - ./web:/srv/web:ro   # front-end edits apply on refresh, no rebuild
    depends_on:
      db: { condition: service_healthy }
      scraper: { condition: service_started }

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://binbot:binbot@db:5432/binbot
      SCRAPER_URL: http://scraper:8100
    command: python -m app.workers.main
    depends_on:
      db: { condition: service_healthy }
      scraper: { condition: service_started }

  # Council scrapers, kept away from the database and secrets as in production
  # (deploy/docker-compose.prod.yml has the full lockdown).
  scraper:
    build: .
    environment:
      SELENIUM_URL: http://selenium:4444
      BROWSER_SESSIONS: 4
      HOME: /tmp
    command: uvicorn app.scraper.service:app --host 0.0.0.0 --port 8100
    user: "65534:65534"
    read_only: true
    working_dir: /tmp
    tmpfs: ["/tmp"]

  # ~86 councils' sites only work in a real browser. Always on, or those councils fail.
  # standalone-chromium is multi-arch (runs natively on Apple Silicon).
  selenium:
    image: selenium/standalone-chromium:4.48.0-20260905  # pinned; bump on purpose
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: 4
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports: ["4444:4444"]

volumes:
  pgdata:
